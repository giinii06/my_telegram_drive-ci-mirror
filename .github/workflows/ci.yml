name: Web and CLI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test ./cmd/tdrive ./cmd/tdrived ./backend/...
      - run: go vet ./cmd/tdrive ./cmd/tdrived ./backend/...
      - run: go build -trimpath -o build/bin/tdrive ./cmd/tdrive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/tdrive/webui/package-lock.json
      - run: npm ci --prefix cmd/tdrive/webui
      - run: npm --prefix cmd/tdrive/webui run lint
      - run: bash scripts/test-web-ui.sh
      - run: npx --prefix cmd/tdrive/webui playwright install --with-deps chromium
      - run: npm --prefix cmd/tdrive/webui run test:browser
