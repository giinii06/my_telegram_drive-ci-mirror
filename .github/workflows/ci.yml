name: Docker and application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash -n install.sh
      - run: TDRIVE_DRY_RUN=1 bash install.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test ./cmd/tdrive ./backend/...
      - run: go vet ./cmd/tdrive ./backend/...
      - run: go build -trimpath -o build/bin/tdrive ./cmd/tdrive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Reject direct host execution
        run: |
          if env -u TDRIVE_CONTAINER build/bin/tdrive version; then
            echo "Host execution unexpectedly succeeded" >&2
            exit 1
          fi
          if env -u TDRIVE_CONTAINER build/bin/tdrive version --json 2>host-error.json; then
            echo "Host JSON execution unexpectedly succeeded" >&2
            exit 1
          fi
          bun -e 'const e = JSON.parse(require("fs").readFileSync("host-error.json", "utf8")); if (e.ok !== false || e.error.code !== "unsupported") process.exit(1)'
          rm host-error.json
      - run: bun install --cwd cmd/tdrive/webui --frozen-lockfile
      - run: bun run --cwd cmd/tdrive/webui lint
      - run: bun run --cwd cmd/tdrive/webui test:unit
      - run: bun run --cwd cmd/tdrive/webui browser:install --with-deps
      - run: bun run --cwd cmd/tdrive/webui test:browser
      - name: Build Docker image
        run: docker build -t tdrive:ci .
      - name: Check container CLI without credentials
        run: |
          docker run --rm --entrypoint tdrive tdrive:ci version
          docker run --rm --entrypoint tdrive tdrive:ci commands --json

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          tags=("$image:sha-$sha")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tags+=("$image:${GITHUB_REF_NAME}")
          else
            tags+=("$image:latest")
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done
          docker build "${args[@]}" .
          for tag in "${tags[@]}"; do
            docker push "$tag"
          done
