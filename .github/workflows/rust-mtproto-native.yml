name: Rust native user MTProto CLI

on:
  push:
    paths:
      - "apps/tdrive-mtproto/**"
      - "Dockerfile.mtproto"
      - ".github/workflows/rust-mtproto-native.yml"
    branches:
      - "refactor/rust-only-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    name: cargo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.92.0 fmt --manifest-path apps/tdrive-mtproto/Cargo.toml --check
      - name: Clippy
        run: cargo +1.92.0 clippy --manifest-path apps/tdrive-mtproto/Cargo.toml --all-targets -- -D warnings
      - name: Offline policy tests
        run: cargo +1.92.0 test --manifest-path apps/tdrive-mtproto/Cargo.toml
      - name: Release binary
        run: cargo +1.92.0 build --manifest-path apps/tdrive-mtproto/Cargo.toml --release
      - name: Offline help smoke (no API keys or session)
        run: apps/tdrive-mtproto/target/release/tdrive-mtproto --help

  headless-image:
    name: Build Docker image without account secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build no-secret experimental image
        run: docker build --file Dockerfile.mtproto --tag tdrive-mtproto:ci .
      - name: Run no-secret help smoke
        run: docker run --rm tdrive-mtproto:ci --help
