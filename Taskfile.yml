version: '3'
tasks:
  build:
    desc: Build the CLI with the embedded web UI
    cmds:
      - mkdir -p build/bin
      - go build -trimpath -o build/bin/tdrive ./cmd/tdrive
  run:
    desc: Run the web workspace
    cmds:
      - go run ./cmd/tdrive web --port 8080
  test:
    cmds:
      - go test ./cmd/tdrive ./cmd/tdrived ./backend/...
      - bash scripts/test-web-ui.sh
  lint:
    cmds:
      - go vet ./cmd/tdrive ./cmd/tdrived ./backend/...
      - npm --prefix cmd/tdrive/webui run lint
  package:
    requires:
      vars: [VERSION]
    cmds:
      - bash scripts/package-cli-release.sh '{{.VERSION}}'
