<!DOCTYPE html>
<html lang="ko" data-ui-version="drive-material-v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDrive</title>
<style>
:root {
  color-scheme:light;
  --bg:#fff; --panel:#fff; --panel2:#f8fafd; --line:#dadce0;
  --fg:#1f1f1f; --dim:#5f6368; --acc:#0b57d0; --sel:#c2e7ff;
  --hover:#edf2fa; --on-primary:#fff; --danger:#b3261e;
  --radius:8px; --radius-panel:16px; --shadow:0 4px 12px rgba(60,64,67,.22);
  --scrim:rgba(32,33,36,.4); --media-bg:#202124; --search-bg:#e9eef6; --brand-green:#0f9d58; --brand-yellow:#fbbc04; --brand-blue:#4285f4;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--panel2); color:var(--fg); font:14px/1.5 Arial,"Noto Sans KR",sans-serif; display:flex; flex-direction:column; overflow:hidden; }
button, input, select { font:inherit; }
button { background:transparent; color:var(--fg); border:1px solid transparent; border-radius:20px; padding:8px 14px; min-height:36px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:10px; white-space:nowrap; }
button:hover { background:var(--hover); }
button:disabled { opacity:.38; cursor:default; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
button.primary { background:var(--acc); color:var(--on-primary); }
button.primary:hover { filter:brightness(.93); }
input[type=text], input[type=search], select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; min-width:0; }
a { color:var(--acc); }
.icon { width:20px; height:20px; flex-shrink:0; display:inline-block; vertical-align:middle; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon-button { padding:10px; width:40px; height:40px; flex-shrink:0; border-radius:50%; }
#navbar { height:64px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:8px 20px 8px 24px; }
.web-brand { display:flex; align-items:center; gap:10px; width:216px; flex-shrink:0; color:var(--dim); font-size:23px; font-weight:400; letter-spacing:-.4px; }
.web-brand svg { width:36px; height:36px; }
.search-box { display:flex; align-items:center; background:var(--search-bg); border-radius:28px; height:48px; width:min(720px,100%); padding:0 16px; gap:16px; }
.search-box:focus-within { background:var(--bg); box-shadow:var(--shadow); }
#search { flex:1; width:100%; min-width:0; border:0; outline:none; background:transparent; font-size:16px; padding:12px 0; }
.header-actions { margin-left:auto; display:flex; align-items:center; gap:4px; }
.account-mark { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; color:var(--on-primary); background:var(--acc); font-size:16px; margin-left:8px; }
#body { flex:1; display:flex; min-height:0; padding-bottom:16px; padding-right:16px; gap:0; }
#side { display:flex; flex-direction:column; width:256px; min-width:256px; padding:8px 12px; }
.new-wrap { position:relative; align-self:flex-start; margin:0 0 20px 4px; }
#btnCreate { height:56px; padding:0 20px 0 16px; border-radius:16px; background:var(--bg); box-shadow:0 1px 3px rgba(60,64,67,.3); font-weight:500; }
#btnCreate:hover { background:var(--search-bg); box-shadow:var(--shadow); }
#btnCreate .icon { width:24px; height:24px; }
#menuNew { top:0; left:0; min-width:240px; }
.side-link { width:100%; justify-content:flex-start; height:36px; padding:0 16px; gap:16px; font-size:14px; }
.side-link.current { background:var(--sel); font-weight:600; }
#sidetree { flex:1; overflow:auto; margin-top:4px; }
.trow { display:flex; align-items:center; gap:12px; min-height:36px; padding:6px 12px; border-radius:20px; cursor:pointer; white-space:nowrap; user-select:none; }
.trow:hover { background:var(--hover); }
.trow.cur { background:var(--sel); font-weight:600; }
.trow .tw { width:12px; font-size:10px; color:var(--dim); }
.trow .tree-name { overflow:hidden; text-overflow:ellipsis; }
.tkids { margin-left:16px; }
#sidebottom { padding:16px 12px; color:var(--dim); font-size:12px; }
.storage-heading { display:flex; align-items:center; gap:16px; font-size:14px; margin-bottom:10px; }
#storage-summary { padding-left:36px; line-height:1.8; }
#maincol { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg); border-radius:16px; overflow:hidden; }
#workspace-heading { padding:18px 24px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
#workspace-heading h1 { margin:0; font-size:24px; line-height:36px; font-weight:400; display:flex; gap:12px; align-items:center; }
.view-tools { display:flex; align-items:center; gap:8px; }
.view-toggle { display:flex; border:1px solid var(--dim); border-radius:20px; overflow:hidden; }
.view-toggle button { width:52px; min-height:32px; border-radius:0; padding:6px 12px; }
.view-toggle button + button { border-left:1px solid var(--dim); }
.view-toggle button[aria-pressed=true] { background:var(--sel); }
#navigation { display:flex; align-items:center; gap:2px; padding:0 20px 8px; }
#navigation .navbtn { padding:6px; width:32px; min-height:32px; color:var(--dim); }
#address { display:flex; align-items:center; gap:4px; min-width:0; flex:1; white-space:nowrap; overflow:auto; }
#address a { color:var(--dim); text-decoration:none; padding:4px 6px; border-radius:4px; cursor:pointer; }
#address a:hover { background:var(--hover); }
#address input { width:100%; padding:4px 8px; }
#action-area { position:relative; height:56px; flex-shrink:0; }
#filterbar { display:flex; align-items:center; gap:8px; padding:0 24px 8px; height:48px; overflow-x:auto; flex-wrap:nowrap; }
.filter { flex-shrink:0; position:relative; display:flex; align-items:center; }
.filter select { appearance:none; background:transparent; font-size:14px; border-color:var(--dim); border-radius:8px; min-height:32px; padding:4px 30px 4px 12px; cursor:pointer; }
.filter .icon { position:absolute; right:8px; width:16px; height:16px; pointer-events:none; }
.filter select.active { background:var(--sel); border-color:var(--sel); }
#clearFilters, #filterbar #btnPaste { flex-shrink:0; }
#clearFilters { min-height:32px; padding:4px 12px; color:var(--acc); }
#ribbon { position:absolute; top:0; left:24px; right:24px; height:48px; display:flex; align-items:center; gap:2px; margin:0; padding:4px 8px; min-height:48px; border-radius:8px; background:var(--search-bg); overflow-x:auto; flex-shrink:0; }
#selection-count { padding:0 10px; white-space:nowrap; font-size:14px; }
#ribbon button { padding:8px; font-size:12px; }
#ribbon .sep { width:1px; height:24px; background:var(--line); margin:0 4px; flex-shrink:0; }
.menuwrap { position:relative; }
.menu, #ctxmenu { position:absolute; background:var(--panel); border:0; border-radius:4px; min-width:210px; padding:8px 0; z-index:40; box-shadow:var(--shadow); }
.menu { top:100%; left:0; }
.menu button, #ctxmenu button { display:flex; justify-content:flex-start; width:100%; text-align:left; border-radius:0; padding:8px 16px; min-height:36px; }
.menu .tick { width:18px; }
#menuView, #menuSort { left:auto; right:0; }
#colhead { display:flex; gap:12px; align-items:center; min-height:40px; margin:0 24px; padding:8px 12px; color:var(--dim); border-bottom:1px solid var(--line); font-size:12px; }
#colhead:empty { display:none; }
#colhead span { cursor:pointer; user-select:none; }
#colhead span:hover { color:var(--fg); }
#files { flex:1; min-height:0; overflow:auto; padding:0 24px 20px; }
.row { display:flex; align-items:center; gap:12px; padding:8px 12px; min-height:48px; border-bottom:1px solid var(--line); cursor:default; user-select:none; }
.row:hover { background:var(--hover); }
.row.sel { background:var(--sel); }
.row.cut, .tile.cut { opacity:.45; }
.row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.row .c2, .row .c3, .row .c4 { color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .c2 { width:150px; } .row .c3 { width:90px; text-align:right; } .row .c4 { width:130px; }
.cb { width:16px; height:16px; margin:0; flex-shrink:0; accent-color:var(--acc); cursor:pointer; }
.row .file-icon { margin-right:4px; }
.file-icon { width:24px; height:24px; color:var(--dim); }
.file-icon.folder { fill:currentColor; stroke-width:1; }
.file-icon.image { color:#d93025; }
.file-icon.document { color:#4285f4; }
.file-icon.sheet { color:#188038; }
.file-icon.video { color:#d93025; }
.file-icon.audio { color:#a142f4; }
.file-icon.pdf { color:#ea4335; }
.file-icon.archive { color:#f9ab00; }
#files.icons { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; align-content:start; align-items:start; padding-top:8px; }
.tile { position:relative; display:flex; flex-direction:column; gap:12px; min-width:0; padding:12px; border:1px solid transparent; border-radius:12px; background:var(--panel2); cursor:default; user-select:none; }
.tile:hover { background:var(--search-bg); }
.tile.sel { background:var(--sel); }
.tile .tile-heading { display:flex; align-items:center; gap:8px; width:100%; }
.tile .tile-heading .file-icon { width:20px; height:20px; }
.tile .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; font-size:13px; }
.tile .ic { height:142px; display:flex; align-items:center; justify-content:center; background:var(--bg); border-radius:8px; position:relative; overflow:hidden; }
.tile .ic .file-icon { width:56px; height:56px; }
.tile .ic.has-thumb .file-icon { display:none; }
.tile .ic .thumb { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .15s; }
.tile .ic.has-thumb .thumb { opacity:1; }
.tile.folder-tile .ic { display:none; }
.tile .cb { margin-left:auto; }
.empty-state { height:100%; min-height:220px; display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--dim); gap:12px; text-align:center; padding:24px; }
.empty-state .icon { width:80px; height:80px; color:var(--acc); stroke-width:1; }
.empty-state strong { color:var(--fg); font-size:20px; font-weight:400; }
#statusbar { display:flex; gap:14px; padding:8px 24px; min-height:34px; color:var(--dim); font-size:12px; }
#details { width:280px; border-left:1px solid var(--line); overflow:auto; padding:24px; background:var(--bg); border-radius:0 16px 16px 0; }
#details .pv { text-align:center; margin-bottom:16px; }
#details img, #details video { max-width:100%; max-height:180px; }
#details dl { margin:0; font-size:13px; }
#details dt { color:var(--dim); margin-top:12px; }
#details dd { margin:4px 0 0; word-break:break-all; }
#ctxmenu { position:fixed; z-index:60; display:none; }
#ctxmenu .sep { height:1px; background:var(--line); margin:8px 0; }
#modalWrap { position:fixed; inset:0; background:var(--scrim); display:none; align-items:center; justify-content:center; z-index:70; }
#modalWrap.open { display:flex; }
#modal { background:var(--panel); border-radius:24px; padding:24px; width:min(480px,92vw); max-height:90vh; overflow:auto; box-shadow:var(--shadow); }
#modal h3 { margin:0 0 20px; font-size:24px; font-weight:400; }
#modal input { width:100%; margin-bottom:12px; }
#modal .btns { display:flex; justify-content:flex-end; gap:8px; padding-top:16px; }
#modal .btns button { color:var(--acc); }
#modal .btns .primary { color:var(--on-primary); }
#modal .sect { margin:0 0 16px; }
#modal .sect h4 { margin:0 0 8px; font-weight:500; }
#modal .kv, #modal .props .pr { display:flex; gap:12px; padding:4px 0; font-size:13px; }
#modal .kv .k, #modal .props .k { width:100px; color:var(--dim); flex-shrink:0; }
#modal .kv .v, #modal .props .v { word-break:break-all; }
#modal label.chk { display:flex; gap:8px; align-items:center; }
#modal label.chk input { width:auto; margin:0; }
#movelist { max-height:40vh; overflow:auto; border:1px solid var(--line); border-radius:8px; margin:8px 0; }
#movelist .mrow { display:flex; gap:8px; align-items:center; padding:10px 12px; cursor:pointer; }
#movelist .mrow:hover { background:var(--hover); }
#movelist .mrow.cur { background:var(--sel); }
#movecrumbs { color:var(--dim); font-size:12px; }
#movecrumbs a { color:var(--fg); cursor:pointer; text-decoration:none; }
#tokbox { display:flex; gap:6px; }
#tokbox input { flex:1; }
#preview { position:fixed; inset:0; background:var(--media-bg); color:var(--on-primary); display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:65; padding:24px; }
#preview.open { display:flex; }
#preview button, #preview a { color:var(--on-primary); }
#preview button:hover { background:var(--dim); }
#preview video, #preview img, #preview iframe { max-width:92vw; max-height:74vh; background:var(--media-bg); }
#preview pre { max-width:92vw; max-height:74vh; overflow:auto; background:var(--media-bg); padding:12px; width:80vw; }
#pvbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
#pvcap { font-size:13px; max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#drop { position:fixed; inset:12px; border:3px solid var(--acc); border-radius:20px; display:none; align-items:center; justify-content:center; font-size:22px; background:var(--search-bg); z-index:80; }
#drop.on { display:flex; }
#uploads { position:fixed; right:24px; bottom:16px; width:min(380px,90vw); background:var(--panel); border-radius:12px 12px 0 0; padding:16px; display:none; z-index:55; max-height:50vh; overflow:auto; box-shadow:var(--shadow); }
#uploads.open { display:block; }
#uploads h3 { margin:0 0 16px; font-size:16px; font-weight:500; }
.ufile { margin-bottom:12px; font-size:12px; }
.ufile .uname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stage { display:flex; align-items:center; gap:6px; margin-top:4px; }
.stage .lbl { width:96px; color:var(--dim); white-space:nowrap; }
.stage progress { flex:1; min-width:0; height:6px; accent-color:var(--acc); }
.stage .pct { width:64px; text-align:right; color:var(--dim); }
#toast { position:fixed; bottom:24px; left:24px; color:var(--on-primary); font-size:14px; background:var(--media-bg); padding:12px 20px; border-radius:4px; z-index:90; max-width:calc(100vw - 48px); box-shadow:var(--shadow); }
#toast:empty, #fileInput, #dirInput { display:none; }
#btnSidebar { display:none; }
@media (max-width:1100px) {
  .web-brand { width:184px; }
  #side { width:224px; min-width:224px; }
  #workspace-heading { padding-inline:16px; }
  #details { position:fixed; right:16px; top:64px; bottom:16px; z-index:35; width:300px; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  #ribbon .action-label { display:none; }
  .row .c2, #colhead [data-column=type] { display:none; }
  .search-box { max-width:600px; }
}
@media (max-width:700px) {
  #navbar { height:auto; min-height:64px; flex-wrap:wrap; gap:8px; padding:8px 16px; }
  #btnSidebar { display:inline-flex; }
  .web-brand { width:auto; font-size:22px; gap:8px; }
  .web-brand svg { width:30px; height:30px; }
  .search-box { order:3; width:100%; height:44px; }
  .header-actions { margin-left:auto; }
  .header-actions .account-mark { display:none; }
  #side { display:none; position:fixed; left:0; top:116px; bottom:0; z-index:45; background:var(--panel2); width:256px; box-shadow:var(--shadow); }
  #side.open { display:flex; }
  #body { padding:4px 8px 8px; }
  #maincol { border-radius:12px; }
  #workspace-heading { padding:16px 12px 8px; }
  #workspace-heading h1 { font-size:22px; gap:4px; }
  .view-tools { gap:2px; }
  .view-toggle button { width:36px; padding:4px; }
  #btnSort { padding:6px; }
  #btnSort .action-label { display:none; }
  #navigation { padding:0 8px 8px; }
  #filterbar { padding:0 12px 12px; gap:6px; }
  .filter select { font-size:12px; padding-left:8px; }
  #ribbon { margin:0; left:12px; right:12px; }
  #files { padding:0 12px 12px; }
  #colhead { margin:0 12px; padding-inline:8px; }
  .row { padding-inline:8px; gap:8px; min-height:56px; }
  .row .c4, #colhead [data-column=date] { display:none; }
  .row .c3 { width:60px; }
  #colhead [data-column=size] { width:60px !important; }
  #files.icons { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .tile { padding:10px; }
  .tile .ic { height:120px; }
  #statusbar { padding-inline:16px; }
  #details { position:fixed; right:8px; top:120px; bottom:8px; z-index:35; width:min(300px,90vw); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
}
@media (prefers-reduced-motion:no-preference) { button { transition:background-color 120ms ease; } }
/* onboarding */
#onboarding { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(180deg,var(--panel2),var(--bg)); overflow:auto; }
.ob-card { width:min(460px,100%); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-panel); box-shadow:var(--shadow); padding:32px; }
.ob-brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; font-size:20px; font-weight:700; }
.ob-brand svg { width:36px; height:32px; }
.ob-card h1 { font-size:22px; margin:0 0 6px; }
.ob-sub { color:var(--dim); margin:0 0 18px; }
.ob-field { display:flex; flex-direction:column; gap:6px; margin:14px 0; }
.ob-field label { font-size:13px; color:var(--dim); }
.ob-field input { width:100%; }
.ob-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
.ob-candidates { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
.ob-candidate { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; }
.ob-candidate:hover { background:var(--hover); }
.ob-candidate input { margin-top:3px; }
.ob-candidate .t { font-weight:600; }
.ob-candidate .d { color:var(--dim); font-size:12px; }
.ob-error { color:var(--danger); min-height:20px; margin:8px 0 0; font-size:13px; }
.ob-note { color:var(--dim); font-size:12px; margin-top:16px; }
.ob-wait { padding:18px 0; color:var(--dim); }
.ob-wait .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--acc); margin-right:8px; animation:obpulse 1s infinite alternate; }
@keyframes obpulse { from { opacity:.3; } to { opacity:1; } }
</style>
</head>
<body>
<div id="onboarding" hidden>
<div class="ob-card">
<div class="ob-brand"><svg viewBox="0 0 36 32" aria-hidden="true"><path fill="var(--brand-green)" d="M12 0h12L12 21H0Z"/><path fill="var(--brand-yellow)" d="M24 0 36 21H24L12 0Z"/><path fill="var(--brand-blue)" d="M0 21h36l-6 11H6Z"/></svg><span>TDrive</span></div>
<h1>시작하기</h1>
<p class="ob-sub" id="obSub"></p>
<div id="obBody"></div>
<p class="ob-error" id="obError" role="alert"></p>
<p class="ob-note">이 설정은 Tailscale로 연결된 기기에서만 진행할 수 있습니다.</p>

<script>
"use strict";
var token = new URLSearchParams(location.search).get("token") || "";
function withToken(u) {
  if (!token) return u;
  return u + (u.indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(token);
}
function $(id) { return document.getElementById(id); }
function toast(msg) { $("toast").textContent = msg; }

var state = {
  cwd: "/", entries: [], hist: ["/"], hidx: 0,
  sortKey: "name", sortDir: 1, view: "details",
  sel: [], anchor: -1, clip: null, detailsPane: false, searching: "",
  filters: {type: "all", date: "all"}
};

function svgIcon(name, className) {
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", className || "icon");
  svg.setAttribute("aria-hidden", "true");
  var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-" + name);
  svg.appendChild(use);
  return svg;
}
var FILE_CATEGORIES = {
  image: ["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg", "heic"],
  video: ["mp4", "m4v", "mov", "mkv", "webm", "avi"],
  audio: ["mp3", "m4a", "wav", "flac", "ogg", "aac", "opus"],
  document: ["txt", "md", "log", "doc", "docx", "hwp", "odt", "rtf"],
  sheet: ["csv", "xls", "xlsx", "ods"],
  pdf: ["pdf"], archive: ["zip", "gz", "tgz", "7z", "rar", "tar"]
};
function fileCategory(e) {
  if (e.type === "folder") return "folder";
  var ext = extOf(e.name);
  for (var category in FILE_CATEGORIES) if (FILE_CATEGORIES[category].indexOf(ext) >= 0) return category;
  return "file";
}
function fileIcon(e) {
  var category = fileCategory(e);
  var name = category === "document" || category === "pdf" ? "file" : category;
  return svgIcon(name, "icon file-icon " + category);
}
function visibleEntries() {
  var list = state.searching ? state.entries.slice() : sortedEntries();
  var since = new Date();
  if (state.filters.date === "1") since.setHours(0, 0, 0, 0);
  else since = new Date(Date.now() - Number(state.filters.date) * 86400000);
  return list.filter(function(e) {
    var type = state.filters.type;
    var matchesType = type === "all" || (type === "file" ? e.type === "file" : fileCategory(e) === type);
    return matchesType && (state.filters.date === "all" || (!!e.upload_time && e.upload_time * 1000 >= since.getTime()));
  });
}
function applyFilters() {
  state.filters.type = $("filterType").value;
  state.filters.date = $("filterDate").value;
  state.sel = []; state.anchor = -1;
  renderAll();
}

var TYPE_LABELS = {pdf:"PDF 문서", mp4:"MP4 비디오", m4v:"M4V 비디오", mov:"MOV 비디오", mkv:"MKV 비디오", webm:"WebM 비디오", avi:"AVI 비디오", mp3:"MP3 오디오", m4a:"M4A 오디오", wav:"WAV 오디오", flac:"FLAC 오디오", ogg:"OGG 오디오", jpg:"JPEG 이미지", jpeg:"JPEG 이미지", png:"PNG 이미지", gif:"GIF 이미지", webp:"WebP 이미지", bmp:"BMP 이미지", txt:"텍스트 문서", md:"Markdown 문서", log:"로그 파일", csv:"CSV 파일", json:"JSON 파일", xml:"XML 파일", zip:"ZIP 압축 파일", tgz:"GZIP 압축 파일", gz:"GZIP 압축 파일", "7z":"7-Zip 압축 파일", rar:"RAR 압축 파일", exe:"응용 프로그램", msi:"Windows 설치 관리자", apk:"Android 패키지", ipa:"iOS 앱", docx:"Word 문서", xlsx:"Excel 문서", pptx:"PowerPoint 문서", hwp:"한글 문서", srt:"자막 파일", vtt:"자막 파일"};

function extOf(name) { var i = name.lastIndexOf("."); return i < 0 ? "" : name.slice(i + 1).toLowerCase(); }
function typeOf(e) { if (e.type === "folder") return "파일 폴더"; var l = TYPE_LABELS[extOf(e.name)]; return l || ((extOf(e.name) || "알 수 없는").toUpperCase() + " 파일"); }
function fmtSize(n) {
  if (n == null || n === 0) return n === 0 ? "0 바이트" : "";
  if (n < 1024) return n + " 바이트";
  var units = ["KB","MB","GB","TB"], v = n, u = "바이트";
  for (var i = 0; i < units.length; i++) { v /= 1024; u = units[i]; if (v < 1024) break; }
  return (Math.round(v * 10) / 10) + " " + u;
}
function fmtSizeShort(n) {
  if (!n) return "";
  if (n < 1024) return n + " B";
  var units = ["KB","MB","GB","TB"], v = n;
  for (var i = 0; i < units.length; i++) { v /= 1024; if (v < 1024) return (Math.round(v * 10) / 10) + " " + units[i]; }
  return v + " PB";
}
function fmtTime(t) { return t ? new Date(t * 1000).toLocaleString() : ""; }

async function api(url, opts) {
  var r = await fetch(withToken(url), opts);
  var j = await r.json().catch(function() { return {}; });
  if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ---------- onboarding ---------- */
var appStarted = false;
var onboardingPoll = null;
var onboardingStage = "";
var onboardingError = "";

function obNode(tag, cls, text) {
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  return el;
}
function obError(msg) {
  onboardingError = msg || "";
  $("obError").textContent = onboardingError;
}
function obShow() {
  $("onboarding").hidden = false;
  $("navbar").hidden = true;
  $("body").hidden = true;
}
function obHide() {
  $("onboarding").hidden = true;
  $("navbar").hidden = false;
  $("body").hidden = false;
}
function stopOnboardingPoll() {
  if (onboardingPoll) { clearInterval(onboardingPoll); onboardingPoll = null; }
}
function obDone() {
  stopOnboardingPoll();
  obHide();
  startApp();
}
function startApp() {
  if (appStarted) return;
  appStarted = true;
  var initial = pathFromURL();
  state.hist = [initial];
  state.hidx = 0;
  load(initial, false);
}
function obField(type, label, id, placeholder, autocomplete) {
  var wrap = obNode("div", "ob-field");
  var lab = obNode("label", "", label);
  lab.setAttribute("for", id);
  var input = document.createElement("input");
  input.type = type;
  input.id = id;
  if (placeholder) input.placeholder = placeholder;
  if (autocomplete) input.autocomplete = autocomplete;
  wrap.appendChild(lab);
  wrap.appendChild(input);
  return {wrap: wrap, input: input};
}
function obButton(label, primary, onClick) {
  var button = obNode("button", primary ? "primary" : "", label);
  button.type = "button";
  button.onclick = onClick;
  return button;
}
function obPost(url, data) {
  return api(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
}
async function obCancelLogin() {
  try {
    await obPost("/api/onboarding/cancel", {});
    obRender(await obStatus());
  } catch (e) {
    obError(e.message);
  }
}
function obStatus() {
  return api("/api/onboarding/status").then(function(j) { return j.onboarding || {}; });
}
function pollOnboarding() {
  stopOnboardingPoll();
  onboardingPoll = setInterval(async function() {
    try {
      var st = await obStatus();
      if (st.stage === "ready") { obDone(); return; }
      if (st.stage !== onboardingStage) { obRender(st); return; }
      if (st.error && st.error !== onboardingError) obError(st.error);
    } catch (e) {
      stopOnboardingPoll();
      obError(e.message);
    }
  }, 1000);
}
async function loadOnboardingDrives(body) {
  body.textContent = "";
  body.appendChild(obNode("div", "ob-wait", "드라이브를 불러오는 중…"));
  try {
    var j = await api("/api/onboarding/drives");
    body.textContent = "";
    var candidates = j.candidates || [];
    if (!candidates.length) {
      body.appendChild(obNode("p", "ob-sub", "사용할 수 있는 채널이 없습니다. 새 TDrive를 만들어 주세요."));
    } else {
      var list = obNode("div", "ob-candidates");
      candidates.forEach(function(candidate) {
        var row = obNode("label", "ob-candidate");
        var radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "obDrive";
        radio.value = candidate.id;
        if (candidate.recommended) radio.checked = true;
        var text = obNode("span");
        text.appendChild(obNode("div", "t", candidate.title || "제목 없는 채널"));
        var detail = candidate.has_activity ? "활동 있음" : "비어 있음";
        if (candidate.recommended) detail += " · 추천";
        text.appendChild(obNode("div", "d", detail));
        row.appendChild(radio);
        row.appendChild(text);
        list.appendChild(row);
      });
      body.appendChild(list);
    }
    var actions = obNode("div", "ob-actions");
    if (candidates.length) {
      var use = obButton("이 드라이브 사용", true, async function() {
        var selected = body.querySelector("input[name=obDrive]:checked");
        if (!selected) { obError("드라이브를 선택하세요."); return; }
        use.disabled = true;
        try {
          await obPost("/api/onboarding/drive", {channel_id: selected.value});
          obRender({stage: "waiting"});
        } catch (e) {
          use.disabled = false;
          obError(e.message);
        }
      });
      actions.appendChild(use);
    }
    var create = obButton("새 TDrive 만들기", !candidates.length, async function() {
      obError("");
      if (!confirm("새 Telegram 채널을 만들어 TDrive로 사용할까요?")) return;
      create.disabled = true;
      try {
        await obPost("/api/onboarding/drive", {create: true});
        obRender({stage: "waiting"});
      } catch (e) {
        create.disabled = false;
        obError(e.message);
      }
    });
    actions.appendChild(create);
    body.appendChild(actions);
  } catch (e) {
    body.textContent = "";
    obError(e.message);
  }
}
function obRender(st) {
  st = st || {};
  onboardingStage = st.stage || "api";
  if (st.stage !== "waiting") stopOnboardingPoll();

  for (var i = 0; i < items.length; i++) {
    var src = items[i];
    var dst = (state.cwd === "/" ? "" : state.cwd) + "/" + freeName(state.cwd, baseName(src), taken);
    taken.push(dst);
    try {
      if (mode === "cut") await api("/api/mv", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({src: src, dst: dst})});
      else await api("/api/cp", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({src: src, dst: dst})});
    } catch (e) { toast("오류: " + e.message); load(state.cwd); return; }
  }
  state.clip = null;
  load(state.cwd);
}
function opDownload() {
  var sel = selectedEntries().filter(function(e) { return e.type === "file"; });
  if (!sel.length) { toast("다운로드할 파일을 선택하세요."); return; }
  (function next(i) {
    if (i >= sel.length) return;
    var a = document.createElement("a");
    a.href = withToken("/file?path=" + encodeURIComponent(sel[i].path) + "&download=1");
    a.download = sel[i].name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function() { next(i + 1); }, 600);
  })(0);
}
function opProps() {
  var sel = selectedEntries();
  if (sel.length !== 1) { toast("속성을 볼 항목 하나를 선택하세요."); return; }
  modalProps(sel[0]);
}

/* ---------- context menu ---------- */
function hideCtx() { $("ctxmenu").style.display = "none"; }
function ctxItem(label, fn, disabled, iconName) {
  var b = document.createElement("button");
  if (iconName) b.appendChild(svgIcon(iconName));
  b.appendChild(document.createTextNode(label)); b.disabled = !!disabled;
  b.onclick = function() { hideCtx(); fn(); };
  return b;
}
function ctxSep() { var d = document.createElement("div"); d.className = "sep"; return d; }
function showCtx(x, y, kind) {
  var m = $("ctxmenu"); m.textContent = "";
  var sel = selectedEntries();
  if (kind === "items") {
    var one = sel.length === 1;
    m.appendChild(ctxItem("열기", function() { if (one) openEntry(sel[0]); else if (sel.length) openEntry(sel[0]); }));
    m.appendChild(ctxItem("다운로드", opDownload, !sel.some(function(e) { return e.type === "file"; }), "download"));
    m.appendChild(ctxSep());
    m.appendChild(ctxItem("잘라내기", opCut, false, "cut"));
    m.appendChild(ctxItem("복사", opCopy, false, "copy"));
    m.appendChild(ctxItem("이동", openMoveTo, false, "move"));
    m.appendChild(ctxSep());
    m.appendChild(ctxItem("이름 바꾸기", opRename, !one, "edit"));
    m.appendChild(ctxItem("삭제", opDelete, false, "delete"));
    m.appendChild(ctxItem("파일 정보", opProps, !one, "info"));
  } else {
    m.appendChild(ctxItem("새 폴더", opMkdir, false, "folder"));
    m.appendChild(ctxItem("파일 업로드", function() { $("fileInput").click(); }, false, "upload"));
    m.appendChild(ctxSep());
    m.appendChild(ctxItem("붙여넣기", opPaste, !state.clip, "paste"));
    m.appendChild(ctxItem("새로고침", function() { load(state.cwd, false); }, false, "refresh"));
  }
  m.style.display = "block";
  var r = m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth - 220) + "px";
  m.style.top = Math.min(y, window.innerHeight - r.height - 10) + "px";
}

/* ---------- uploads (two stages) ---------- */
function uploadFiles(fileList) {
  var items = [];
  for (var i = 0; i < fileList.length; i++) items.push({file: fileList[i], dir: state.cwd, label: fileList[i].name});
  uploadQueue(items);
}
function uploadQueue(items) {
  if (!items.length) return;
  $("uploads").classList.add("open");
  var chain = Promise.resolve();
  items.forEach(function(item) { chain = chain.then(function() { return uploadOneFile(item); }); });
  chain.then(function() { toast("업로드 완료"); load(state.cwd); });
}
function groupFolderUploads(fileList, base) {
  base = base === "/" ? "" : base;
  var seen = {}, items = [];
  for (var i = 0; i < fileList.length; i++) {
    var rel = fileList[i].webkitRelativePath || fileList[i].name;
    var slash = rel.lastIndexOf("/");
    var reldir = slash < 0 ? "" : rel.slice(0, slash);
    var remote = base + "/" + reldir;
    if (!seen[remote]) seen[remote] = true;
    items.push({file: fileList[i], dir: remote, label: rel});
  }
  var ordered = Object.keys(seen).sort(function(a, b) { return a.length - b.length; });
  return {dirs: ordered, items: items};
}
async function uploadFolderFiles(fileList) {
  if (!fileList.length) return;
  var grouped = groupFolderUploads(fileList, state.cwd);
  $("uploads").classList.add("open");
  toast("폴더 구조 생성 중… (" + grouped.dirs.length + "개)");
  for (var i = 0; i < grouped.dirs.length; i++) {
    try {
      await api("/api/mkdir", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path: grouped.dirs[i]})});
    } catch (e) { toast("오류: " + e.message); return; }
  }
  uploadQueue(grouped.items);
}
function addUploadRow(name) {
  var box = document.createElement("div");
  box.className = "ufile";
  var title = document.createElement("div");
  title.className = "uname"; title.textContent = name; title.title = name;
  box.appendChild(title);
  var stages = {};
  [["s1", "① 브라우저→서버"], ["s2", "② 서버→텔레그램"]].forEach(function(pair) {
    var line = document.createElement("div");
    line.className = "stage";
    var lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = pair[1];
    var bar = document.createElement("progress"); bar.value = 0; bar.max = 100;
    var pct = document.createElement("span"); pct.className = "pct"; pct.textContent = "-";
    line.appendChild(lbl); line.appendChild(bar); line.appendChild(pct);
    box.appendChild(line);
    stages[pair[0]] = {bar: bar, pct: pct};
  });
  var list = $("ulist");
  list.insertBefore(box, list.firstChild);
  return stages;
}
function setStage(row, key, pct, text) {
  row[key].bar.value = pct;
  row[key].pct.textContent = text != null ? text : (Math.round(pct) + "%");
}
function uploadOneFile(item) {
  return new Promise(function(resolve) {
    var file = item.file || item;
    var dir = item.dir || state.cwd;
    var label = item.label || file.name;
    var row = addUploadRow(label);
    var tries = 0;
    (function attempt() {
      tries++;
      var fd = new FormData();
      fd.append("files", file, file.name);
      var xhr = new XMLHttpRequest();
      xhr.upload.onprogress = function(ev) {
        if (ev.lengthComputable) setStage(row, "s1", ev.loaded / ev.total * 100);
      };
      xhr.onload = function() {
        // 503 means the server-side Telegram queue is momentarily full when
        // dropping many files at once: the bytes are still here, retry once.
        if (xhr.status === 503 && tries < 2) {
          setStage(row, "s1", 0, "대기 중");
          setTimeout(attempt, 3000);
          return;
        }
        if (xhr.status !== 200) {
          var msg = "HTTP " + xhr.status;
          try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
          setStage(row, "s1", 0, "실패"); setStage(row, "s2", 0, "실패");
          row.s1.pct.title = msg;
          resolve();
          return;
        }
        setStage(row, "s1", 100, "수신 완료");
        var job = JSON.parse(xhr.responseText).job;
        pollTelegramStage(row, job.id, resolve);
      };
      xhr.onerror = function() { setStage(row, "s1", 0, "실패"); setStage(row, "s2", 0, "-"); resolve(); };
      xhr.open("POST", withToken("/api/upload?path=" + encodeURIComponent(dir) + (prefs.encryptUpload === false ? "&encrypt=0" : "")));
      xhr.send(fd);
    })();
  });
}
function pollTelegramStage(row, jobId, resolve) {
  setStage(row, "s2", 0, "대기 중");
  function tick() {
    api("/api/upload/status?id=" + encodeURIComponent(jobId)).then(function(j) {
      var file = ((j.job || {}).files || [])[0];
      if (!file) { setStage(row, "s2", 0, "실패"); resolve(); return; }
      if (file.stage === "telegram" || file.stage === "queued") {
        setStage(row, "s2", file.progress || 0);
        setTimeout(tick, 700);
      } else if (file.stage === "done") {
        setStage(row, "s2", 100, "완료"); resolve();
      } else {
        setStage(row, "s2", file.progress || 0, "실패");
        row.s2.pct.title = file.error || "";
        resolve();
      }
    }).catch(function() { setStage(row, "s2", row.s2.bar.value, "재시도 중"); setTimeout(tick, 1500); });
  }
  tick();
}

/* ---------- search ---------- */
var searchTimer = null;
function doSearch(q) {
  clearTimeout(searchTimer);
  if (!q) { if (state.searching) load(state.cwd); return; }
  searchTimer = setTimeout(function() {
    api("/api/find?q=" + encodeURIComponent(q)).then(function(j) {
      state.searching = q;
      state.entries = (j.results || []).map(function(r) { return {type: r.type, name: r.name, path: r.path, size: r.size, upload_time: r.upload_time}; });
      state.sel = [];
      state.anchor = -1;
      renderAll();
      toast("검색 결과 " + state.entries.length + "개");
    }).catch(function(e) { toast("오류: " + e.message); });
  }, 300);
}

/* ---------- menus / wiring ---------- */
function syncMenus() {
  $("btnList").setAttribute("aria-pressed", state.view === "details");
  $("btnGrid").setAttribute("aria-pressed", state.view === "icons");
  var vw = $("menuView").querySelectorAll("button");
  for (var i = 0; i < vw.length; i++) vw[i].querySelector(".tick").textContent = vw[i].getAttribute("data-view") === state.view ? "✓" : "";
  var st = $("menuSort").querySelectorAll("button");
  for (var j = 0; j < st.length; j++) st[j].querySelector(".tick").textContent = st[j].getAttribute("data-sort") === state.sortKey ? "✓" : "";
}
var MENU_TRIGGERS = {menuView: "btnView", menuSort: "btnSort", menuNew: "btnCreate"};
function closeMenus() {
  for (var id in MENU_TRIGGERS) { $(id).hidden = true; $(MENU_TRIGGERS[id]).setAttribute("aria-expanded", "false"); }
}
function toggleMenu(id) {
  var open = $(id).hidden;
  closeMenus();
  $(id).hidden = !open;
  $(MENU_TRIGGERS[id]).setAttribute("aria-expanded", open);
}
function renderAll() {
  renderAddress(); renderSide(); renderColHead(); renderFiles(); renderStatus(); renderDetails(); syncMenus();
  $("btnBack").disabled = state.hidx <= 0;
  $("btnFwd").disabled = state.hidx >= state.hist.length - 1;
  $("btnUp").disabled = state.cwd === "/";
  $("btnPaste").disabled = !state.clip;
  $("filterType").classList.toggle("active", state.filters.type !== "all");
  $("filterDate").classList.toggle("active", state.filters.date !== "all");
  $("clearFilters").hidden = state.filters.type === "all" && state.filters.date === "all";
}
function wire() {
  $("btnCreate").onclick = function() { toggleMenu("menuNew"); };
  $("btnHome").onclick = function() { $("filterType").value = "all"; $("filterDate").value = "all"; applyFilters(); load("/"); };
  $("btnSidebar").onclick = function() { var open = $("side").classList.toggle("open"); $("btnSidebar").setAttribute("aria-expanded", open); };
  $("filterType").onchange = applyFilters;
  $("filterDate").onchange = applyFilters;
  $("clearFilters").onclick = function() { $("filterType").value = "all"; $("filterDate").value = "all"; applyFilters(); };
  $("btnClearSelection").onclick = function() { state.sel = []; renderAll(); };
  $("btnList").onclick = function() { state.view = "details"; savePrefs(); renderAll(); };
  $("btnGrid").onclick = function() { state.view = "icons"; savePrefs(); renderAll(); };
  document.querySelectorAll("#ribbon button").forEach(function(button) { if (!button.getAttribute("aria-label")) button.setAttribute("aria-label", button.textContent.trim()); button.title = button.getAttribute("aria-label"); });
  for (var menuId in MENU_TRIGGERS) {
    (function(id) {
      var trigger = $(MENU_TRIGGERS[id]);
      trigger.setAttribute("aria-haspopup", "true"); trigger.setAttribute("aria-expanded", "false"); trigger.setAttribute("aria-controls", id);
      trigger.onkeydown = function(ev) { if (ev.key === "ArrowDown") { ev.preventDefault(); if ($(id).hidden) toggleMenu(id); $(id).querySelector("button").focus(); } };
      $(id).onkeydown = function(ev) {
        var buttons = Array.from($(id).querySelectorAll("button")); var idx = buttons.indexOf(document.activeElement);
        if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); buttons[(idx + (ev.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length].focus(); }
      };
    })(menuId);
  }
  $("btnBack").onclick = function() { goHist(-1); };
  $("btnFwd").onclick = function() { goHist(1); };
  window.onpopstate = syncHistToURL;
  $("btnUp").onclick = goUp;
  $("btnRefresh").onclick = function() { load(state.cwd, false); };
  $("search").oninput = function(ev) { doSearch(ev.target.value.trim()); };
  $("btnNew").onclick = function() { closeMenus(); opMkdir(); };
  $("btnCut").onclick = opCut;
  $("btnCopy").onclick = opCopy;
  $("btnPaste").onclick = opPaste;
  $("btnMoveTo").onclick = openMoveTo;
  $("btnSettings").onclick = openSettings;
  $("btnRename").onclick = opRename;
  $("btnDelete").onclick = opDelete;
  $("btnUpload").onclick = function() { closeMenus(); $("fileInput").click(); };
  $("btnUploadDir").onclick = function() { closeMenus(); $("dirInput").click(); };
  $("btnDownload").onclick = opDownload;
  $("btnProps").onclick = opProps;
  $("btnView").onclick = function() { toggleMenu("menuView"); };
  $("btnSort").onclick = function() { toggleMenu("menuSort"); };
  $("btnDetails").onclick = function() { state.detailsPane = !state.detailsPane; savePrefs(); renderDetails(); };
  var vw = $("menuView").querySelectorAll("button");
  for (var i = 0; i < vw.length; i++) vw[i].onclick = (function(b) { return function() { state.view = b.getAttribute("data-view"); savePrefs(); closeMenus(); renderAll(); }; })(vw[i]);
  var st = $("menuSort").querySelectorAll("button");
  for (var j = 0; j < st.length; j++) st[j].onclick = (function(b) { return function() { var k = b.getAttribute("data-sort"); if (state.sortKey === k) state.sortDir = -state.sortDir; else { state.sortKey = k; state.sortDir = 1; } state.anchor = -1; savePrefs(); closeMenus(); renderAll(); }; })(st[j]);
  $("closePv").onclick = function() { pvList = []; pvIdx = -1; $("stage").textContent = ""; $("preview").classList.remove("open"); };
  $("pvPrev").onclick = function() { pvStep(-1); };
  $("pvNext").onclick = function() { pvStep(1); };
  $("preview").onclick = function(ev) { if (ev.target.id === "preview") $("closePv").onclick(); };
  $("fileInput").onchange = function(ev) { uploadFiles(ev.target.files); ev.target.value = ""; };
  $("dirInput").onchange = function(ev) { uploadFolderFiles(ev.target.files); ev.target.value = ""; };
  $("files").oncontextmenu = function(ev) { if (ev.target.id === "files" || ev.target.className === "icons") { ev.preventDefault(); showCtx(ev.clientX, ev.clientY, "bg"); } };
  document.addEventListener("click", function(ev) {
    if (!ev.target.closest || (!ev.target.closest("#ctxmenu") && !ev.target.closest(".menuwrap"))) { hideCtx(); closeMenus(); }
    if (!ev.target.closest("#side") && !ev.target.closest("#btnSidebar")) { $("side").classList.remove("open"); $("btnSidebar").setAttribute("aria-expanded", "false"); }
  });
  document.addEventListener("keydown", function(ev) {
    if (ev.defaultPrevented) return;
    if (ev.key === "Escape") {
      hideCtx();
      for (var id in MENU_TRIGGERS) if (!$(id).hidden) { closeMenus(); $(MENU_TRIGGERS[id]).focus(); return; }
      $("side").classList.remove("open"); $("btnSidebar").setAttribute("aria-expanded", "false");
    }
    var tag = (ev.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select" || (tag === "button" && (ev.key === "Enter" || ev.key === " "))) return;
    if ($("modalWrap").classList.contains("open") || $("preview").classList.contains("open")) {
      if (ev.key === "Escape") { closeModal(); $("closePv").onclick(); }
      else if (ev.key === "ArrowLeft" && $("preview").classList.contains("open")) pvStep(-1);
      else if (ev.key === "ArrowRight" && $("preview").classList.contains("open")) pvStep(1);
      return;
    }
    if (ev.key === "Enter") { var s = selectedEntries(); if (s.length === 1) openEntry(s[0]); }
    else if (ev.key === "Backspace") goUp();
    else if (ev.key === "Delete") opDelete();
    else if (ev.key === "F2") opRename();
    else if (ev.key === "Escape") { state.sel = []; renderFiles(); renderStatus(); renderDetails(); }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "a") { ev.preventDefault(); state.sel = visibleEntries().map(function(e) { return e.path; }); renderFiles(); renderStatus(); renderDetails(); }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "c") opCopy();
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "x") opCut();
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "v") opPaste();
  });
  var drop = $("drop"), depth = 0;
  window.addEventListener("dragenter", function(ev) { ev.preventDefault(); depth++; drop.classList.add("on"); });
  window.addEventListener("dragleave", function(ev) { ev.preventDefault(); if (--depth <= 0) { depth = 0; drop.classList.remove("on"); } });
  window.addEventListener("dragover", function(ev) { ev.preventDefault(); });
  window.addEventListener("drop", function(ev) { ev.preventDefault(); depth = 0; drop.classList.remove("on"); if (ev.dataTransfer.files.length) uploadFiles(ev.dataTransfer.files); });
}
wire();
loadPrefs();
renderAll();
boot();
</script>
</body>
