# GitLab checks only. Reuses the existing Oracle ARM64 project runner when
# runner #59776971 is explicitly assigned to my_telegram_drive.
# No Telegram credentials, deployments, image publication or DB mutations.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - contracts
  - test

default:
  tags:
    - oracle-arm64
  interruptible: true

legacy-contracts:
  stage: contracts
  image: python:3.12-slim
  script:
    - python3 scripts/check-legacy-contracts.py

rust-contracts:
  stage: test
  image: rust:1.92-bookworm
  script:
    - rustc --version
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked

legacy-go-projection:
  stage: test
  image: golang:1.27-bookworm
  variables:
    GOTOOLCHAIN: "go1.25.13"
    CGO_ENABLED: "0"
    GOMAXPROCS: "2"
    GOFLAGS: "-p=1"
  script:
    - go version
    - go test ./backend/projection -run TestRustTDX1Fixtures -count=1
    - go test ./backend/projection

legacy-web-checks:
  stage: test
  image: oven/bun:1.4.3
  script:
    - bun install --cwd cmd/tdrive/webui --frozen-lockfile
    - bun run --cwd cmd/tdrive/webui lint
    - bun run --cwd cmd/tdrive/webui test:unit
