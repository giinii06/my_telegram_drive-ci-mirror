# GitLab verification only: no Telegram credentials or deployment.
# Existing Oracle A1 ARM64 project runner must have tag oracle-arm64.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - preflight
  - contracts
  - test

default:
  tags:
    - oracle-arm64
  interruptible: true

legacy-contracts:
  stage: preflight
  image: python:3.12-slim
  script:
    - python3 scripts/check-legacy-contracts.py

rust-style:
  stage: preflight
  image: rust:1.92-bookworm
  script:
    - cargo fmt --all --check

legacy-go-fixture:
  stage: contracts
  image: golang:1.27-bookworm
  variables:
    GOTOOLCHAIN: "go1.25.13"
    CGO_ENABLED: "0"
    GOMAXPROCS: "2"
    GOFLAGS: "-p=1"
    TDRIVE_COMPAT_FIXTURE_OUT: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.sqlite"
    TDRIVE_COMPAT_TDE1_OUT: "$CI_PROJECT_DIR/tests/fixtures/tde1/generated"
    TDRIVE_COMPAT_FOLDER_LISTING_OUT: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.listing.tsv"
    TDRIVE_COMPAT_REPLAY_OUT: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.replay.tsv"
    TDRIVE_COMPAT_DIGEST_OUT: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.digest.tsv"
  script:
    - go test ./backend/projection -run '^TestExportRustV16Fixture$' -count=1
    - test -s tests/fixtures/sqlite/go-v16.sqlite
    - test -s tests/fixtures/sqlite/go-v16.listing.tsv
    - test -s tests/fixtures/sqlite/go-v16.replay.tsv
    - test -s tests/fixtures/sqlite/go-v16.digest.tsv
    - go test ./backend/crypto -run '^TestExportRustTDE1Fixtures$' -count=1
    - test -s tests/fixtures/tde1/generated/tde1-0.bin
  artifacts:
    expire_in: 1 day
    paths:
      - tests/fixtures/sqlite/go-v16.sqlite
      - tests/fixtures/sqlite/go-v16.listing.tsv
      - tests/fixtures/sqlite/go-v16.replay.tsv
      - tests/fixtures/sqlite/go-v16.digest.tsv
      - tests/fixtures/tde1/generated/*.bin

rust-contracts:
  stage: test
  image: rust:1.92-bookworm
  needs:
    - job: legacy-go-fixture
      artifacts: true
  variables:
    TDRIVE_GO_SQLITE_FIXTURE: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.sqlite"
    TDRIVE_GO_SQLITE_LISTING_FIXTURE: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.listing.tsv"
    TDRIVE_GO_SQLITE_REPLAY_FIXTURE: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.replay.tsv"
    TDRIVE_GO_SQLITE_DIGEST_FIXTURE: "$CI_PROJECT_DIR/tests/fixtures/sqlite/go-v16.digest.tsv"
    TDRIVE_GO_TDE1_FIXTURES_DIR: "$CI_PROJECT_DIR/tests/fixtures/tde1/generated"
  script:
    - rustc --version
    - test -s "$TDRIVE_GO_SQLITE_FIXTURE"
    - test -s "$TDRIVE_GO_SQLITE_LISTING_FIXTURE"
    - test -s "$TDRIVE_GO_SQLITE_REPLAY_FIXTURE"
    - test -s "$TDRIVE_GO_SQLITE_DIGEST_FIXTURE"
    - test -s "$TDRIVE_GO_TDE1_FIXTURES_DIR/tde1-0.bin"
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked

legacy-go-projection:
  stage: test
  image: golang:1.27-bookworm
  variables:
    GOTOOLCHAIN: "go1.25.13"
    CGO_ENABLED: "0"
    GOMAXPROCS: "2"
    GOFLAGS: "-p=1"
  script:
    - go version
    - go test ./backend/projection -run TestRustTDX1Fixtures -count=1
    - go test ./backend/projection
    - go test ./backend/tgclient -run '^TestRustStableRandomIDVectors$' -count=1
    - go test ./backend/tgclient
    - go test ./backend/crypto
    - go test ./cmd/tdrive-backup -run '^TestRustBackupJobVectors$' -count=1
    - go test ./cmd/tdrive-backup
    - go test ./backend/media -run '^TestRustMediaRangeFixtures$' -count=1

legacy-web-checks:
  stage: test
  image: oven/bun:1.4.3
  script:
    - bun install --cwd cmd/tdrive/webui --frozen-lockfile
    - bun run --cwd cmd/tdrive/webui lint
    - bun run --cwd cmd/tdrive/webui test:unit
